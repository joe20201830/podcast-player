<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b18"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg-grad)"/>

  <!-- Grid lines -->
  <line x1="0" y1="128" x2="512" y2="128" stroke="#00f5ff" stroke-width="0.4" stroke-opacity="0.08"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="#00f5ff" stroke-width="0.4" stroke-opacity="0.08"/>
  <line x1="0" y1="384" x2="512" y2="384" stroke="#00f5ff" stroke-width="0.4" stroke-opacity="0.08"/>
  <line x1="128" y1="0" x2="128" y2="512" stroke="#00f5ff" stroke-width="0.4" stroke-opacity="0.08"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#00f5ff" stroke-width="0.4" stroke-opacity="0.08"/>
  <line x1="384" y1="0" x2="384" y2="512" stroke="#00f5ff" stroke-width="0.4" stroke-opacity="0.08"/>

  <!-- Outer border with clipped corner -->
  <polygon points="40,40 472,40 472,432 432,472 40,472" fill="none" stroke="#00f5ff" stroke-width="3" stroke-opacity="0.6" filter="url(#glow)"/>

  <!-- Corner accent marks -->
  <polyline points="40,80 40,40 80,40" fill="none" stroke="#00f5ff" stroke-width="5" stroke-opacity="0.9" filter="url(#glow)"/>
  <polyline points="432,40 472,40 472,80" fill="none" stroke="#ff00aa" stroke-width="5" stroke-opacity="0.9" filter="url(#glow)"/>
  <polyline points="40,432 40,472 80,472" fill="none" stroke="#ff00aa" stroke-width="5" stroke-opacity="0.9" filter="url(#glow)"/>
  <polyline points="432,472 472,472 472,432" fill="none" stroke="#00f5ff" stroke-width="5" stroke-opacity="0.9" filter="url(#glow)"/>

  <!-- Letter P (centered) -->
  <text
    x="256" y="366"
    text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="300"
    fill="#00f5ff"
    filter="url(#glow-strong)"
    letter-spacing="-10"
  >P</text>

  <!-- Horizontal scan lines left & right of P (mid-height) -->
  <line x1="60" y1="240" x2="138" y2="240" stroke="#00f5ff" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <line x1="60" y1="256" x2="108" y2="256" stroke="#00f5ff" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="272" x2="123" y2="272" stroke="#00f5ff" stroke-width="1.5" opacity="0.4" filter="url(#glow)"/>

  <line x1="374" y1="240" x2="452" y2="240" stroke="#00f5ff" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <line x1="404" y1="256" x2="452" y2="256" stroke="#00f5ff" stroke-width="1" opacity="0.3"/>
  <line x1="389" y1="272" x2="452" y2="272" stroke="#00f5ff" stroke-width="1.5" opacity="0.4" filter="url(#glow)"/>

  <!-- Corner tick marks inside border -->
  <line x1="100" y1="80" x2="140" y2="80" stroke="#00f5ff" stroke-width="2" opacity="0.4"/>
  <line x1="372" y1="80" x2="412" y2="80" stroke="#00f5ff" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="432" x2="140" y2="432" stroke="#00f5ff" stroke-width="2" opacity="0.4"/>
  <line x1="372" y1="432" x2="412" y2="432" stroke="#00f5ff" stroke-width="2" opacity="0.4"/>

  <!-- Dot accents -->
  <circle cx="80" cy="256" r="4" fill="#00f5ff" opacity="0.7" filter="url(#glow)"/>
  <circle cx="432" cy="256" r="4" fill="#00f5ff" opacity="0.7" filter="url(#glow)"/>
  <circle cx="256" cy="90" r="4" fill="#00f5ff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="256" cy="452" r="4" fill="#00f5ff" opacity="0.6" filter="url(#glow)"/>

  <!-- Bottom data strip -->
  <rect x="80" y="440" width="352" height="1.5" fill="#00f5ff" opacity="0.15"/>
  <rect x="80" y="448" width="100" height="1.5" fill="#00f5ff" opacity="0.2"/>
  <rect x="332" y="448" width="100" height="1.5" fill="#00f5ff" opacity="0.2"/>
</svg>
